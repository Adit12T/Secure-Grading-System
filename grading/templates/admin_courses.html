{% extends "base.html" %}{% from "_form.html" import render %}
{% block content %}
<h1>Courses</h1><table><thead><tr><th>Course</th><th>Instructor</th><th>Students</th><th></th></tr></thead><tbody>{% for c in courses %}<tr><td>{{ c.id }} {{ c.name }}</td><td>{{ c.instructor }}</td><td>{{ c.students }}</td><td><a href="{{ url_for('admin.enroll', course_id=c.id) }}">Enroll student</a></td></tr>{% endfor %}</tbody></table><h2>Add a course</h2>{{ render(form, "Add course") }}
{% endblock %}
